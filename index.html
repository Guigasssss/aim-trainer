<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMFORGE — Treinador de Mira</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#06070a;
    --panel:rgba(13,17,26,.88);
    --stroke:rgba(120,170,255,.14);
    --accent:#35e0ff;
    --accent2:#6ea8ff;
    --text:#e6f0ff;
    --muted:#7d8ba6;
    --good:#4ef0a0;
    --bad:#ff4d6d;
  }
  html,body{
    height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;
  }
  #game{display:block;width:100vw;height:100vh;cursor:none;touch-action:none}

  .hidden{display:none !important}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;inset:0;pointer-events:none;z-index:10;
    display:flex;flex-direction:column;
  }
  .hud-top{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:12px 22px;
    background:linear-gradient(180deg,rgba(6,7,10,.9),rgba(6,7,10,0));
  }
  .stat{display:flex;flex-direction:column;align-items:center;min-width:82px}
  .stat .label{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }
  .stat .value{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:20px;font-weight:700;letter-spacing:.02em;
    text-shadow:0 0 18px rgba(53,224,255,.35);
  }
  .stat.big .value{font-size:30px;color:var(--accent)}
  .timerbar{
    height:3px;margin:0 22px;border-radius:3px;
    background:rgba(255,255,255,.06);overflow:hidden;
  }
  #timerfill{
    height:100%;width:100%;border-radius:3px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    box-shadow:0 0 14px rgba(53,224,255,.7);
    transition:width .1s linear;
  }
  #timerfill.low{background:linear-gradient(90deg,#ff9a3c,var(--bad));box-shadow:0 0 14px rgba(255,77,109,.8)}

  /* ---------- SCREENS ---------- */
  .screen{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    padding:20px;cursor:default;
    background:radial-gradient(1200px 700px at 50% 40%,rgba(16,24,42,.72),rgba(4,5,8,.94));
    backdrop-filter:blur(9px);
    animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .panel{
    width:100%;max-width:880px;max-height:92vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--stroke);
    border-radius:20px;padding:26px 28px;
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  }
  .panel.small{max-width:420px;text-align:center}
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:rgba(120,170,255,.2);border-radius:8px}

  .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .logo{
    width:52px;height:52px;flex:none;border-radius:14px;
    display:grid;place-items:center;font-size:26px;color:#04121a;
    background:linear-gradient(140deg,var(--accent),var(--accent2));
    box-shadow:0 0 30px rgba(53,224,255,.45);
  }
  .brand h1{font-size:22px;letter-spacing:.14em;font-weight:800}
  .brand p{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:2px}

  h2{font-size:20px;letter-spacing:.08em;margin-bottom:6px}
  .muted{color:var(--muted);font-size:13px;line-height:1.5}

  /* ---------- MODES ---------- */
  .modes{
    display:grid;gap:10px;margin-bottom:22px;
    grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  }
  .mode-card{
    position:relative;text-align:left;cursor:pointer;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
    border-radius:14px;padding:13px 14px;color:var(--text);
    font-family:inherit;transition:.16s;overflow:hidden;
  }
  .mode-card:hover{background:rgba(255,255,255,.06);border-color:rgba(120,170,255,.3);transform:translateY(-2px)}
  .mode-card.on{
    background:linear-gradient(150deg,rgba(53,224,255,.16),rgba(110,168,255,.06));
    border-color:rgba(53,224,255,.55);
    box-shadow:0 0 0 1px rgba(53,224,255,.2),0 10px 30px -12px rgba(53,224,255,.6);
  }
  .mode-card .mi{font-size:17px;color:var(--accent);display:block;margin-bottom:6px}
  .mode-card .mt{font-size:14px;font-weight:700;display:block;letter-spacing:.03em}
  .mode-card .md{font-size:11px;color:var(--muted);display:block;margin-top:4px;line-height:1.4}
  .mode-card .mb{
    display:block;margin-top:8px;font-size:10px;letter-spacing:.1em;
    color:var(--good);font-family:ui-monospace,monospace;min-height:12px;
  }

  /* ---------- SETTINGS ---------- */
  .settings{
    display:grid;gap:14px 20px;margin-bottom:22px;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  }
  .field{display:flex;flex-direction:column;gap:8px}
  .field > label{
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:700;display:flex;justify-content:space-between;
  }
  .field > label span{color:var(--accent);font-family:ui-monospace,monospace}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{
    flex:1;min-width:52px;cursor:pointer;font-family:inherit;
    padding:8px 6px;font-size:12px;font-weight:600;color:var(--muted);
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    border-radius:9px;transition:.15s;
  }
  .chips button:hover{color:var(--text);border-color:rgba(120,170,255,.35)}
  .chips button.on{
    color:#04121a;background:linear-gradient(140deg,var(--accent),var(--accent2));
    border-color:transparent;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;height:5px;border-radius:5px;
    background:rgba(255,255,255,.1);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;
    box-shadow:0 0 12px rgba(53,224,255,.8);
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border:none;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 12px rgba(53,224,255,.8);
  }

  input[type=color]{
    -webkit-appearance:none;appearance:none;border:none;background:none;
    width:100%;height:34px;cursor:pointer;padding:0;border-radius:9px;overflow:hidden;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:1px solid rgba(255,255,255,.15);border-radius:9px}

  .toggles{display:flex;flex-direction:column;gap:9px;justify-content:center}
  .switch{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);cursor:pointer}
  .switch input{
    -webkit-appearance:none;appearance:none;width:34px;height:19px;border-radius:19px;
    background:rgba(255,255,255,.1);position:relative;cursor:pointer;transition:.2s;flex:none;
  }
  .switch input::after{
    content:"";position:absolute;top:2.5px;left:3px;width:14px;height:14px;
    border-radius:50%;background:#8494ad;transition:.2s;
  }
  .switch input:checked{background:rgba(53,224,255,.28)}
  .switch input:checked::after{left:17px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .switch input:checked ~ span{color:var(--text)}

  /* ---------- BUTTONS ---------- */
  .play{
    width:100%;cursor:pointer;font-family:inherit;border:none;
    padding:16px;border-radius:13px;font-size:14px;font-weight:800;letter-spacing:.16em;
    color:#04121a;background:linear-gradient(140deg,var(--accent),var(--accent2));
    box-shadow:0 12px 40px -12px rgba(53,224,255,.9);
    transition:.18s;
  }
  .play:hover{transform:translateY(-2px);box-shadow:0 18px 50px -12px rgba(53,224,255,1)}
  .play:active{transform:translateY(0)}
  .ghost{
    cursor:pointer;font-family:inherit;padding:16px 22px;border-radius:13px;
    font-size:13px;font-weight:700;letter-spacing:.12em;
    color:var(--muted);background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);transition:.16s;
  }
  .ghost:hover{color:var(--text);border-color:rgba(120,170,255,.4)}
  .hint{text-align:center;font-size:11px;color:var(--muted);margin-top:12px;letter-spacing:.06em}
  .row{display:flex;gap:10px;margin-top:22px}
  .row .play{flex:2}

  /* ---------- RESULTS ---------- */
  .bigscore{
    font-family:ui-monospace,monospace;font-size:56px;font-weight:800;
    text-align:center;color:var(--accent);margin:14px 0 4px;
    text-shadow:0 0 40px rgba(53,224,255,.5);letter-spacing:-.02em;
  }
  .record{
    text-align:center;font-size:12px;letter-spacing:.16em;font-weight:700;
    color:var(--good);margin-bottom:16px;
  }
  .grid-stats{
    display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  }
  .gstat{
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
    border-radius:12px;padding:12px;text-align:center;
  }
  .gstat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .gstat .v{font-family:ui-monospace,monospace;font-size:19px;font-weight:700;margin-top:6px}

  @media(max-width:600px){
    .panel{padding:20px 16px;border-radius:16px}
    .stat .value{font-size:16px}
    .stat.big .value{font-size:23px}
    .stat{min-width:62px}
    .bigscore{font-size:42px}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="stat"><span class="label">Tempo</span><span class="value" id="hudTime">60.0</span></div>
    <div class="stat big"><span class="label">Pontos</span><span class="value" id="hudScore">0</span></div>
    <div class="stat"><span class="label">Precisão</span><span class="value" id="hudAcc">—</span></div>
    <div class="stat"><span class="label" id="hudComboLabel">Combo</span><span class="value" id="hudCombo">x0</span></div>
  </div>
  <div class="timerbar"><div id="timerfill"></div></div>
</div>

<!-- ================= MENU ================= -->
<div id="menu" class="screen">
  <div class="panel">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>AIMFORGE</h1>
        <p>Treinador de mira — versão web</p>
      </div>
    </div>

    <section class="modes" id="modeList"></section>

    <section class="settings">
      <div class="field">
        <label>Duração</label>
        <div class="chips" id="durChips">
          <button data-dur="15">15s</button>
          <button data-dur="30">30s</button>
          <button data-dur="60" class="on">60s</button>
          <button data-dur="120">120s</button>
        </div>
      </div>

      <div class="field">
        <label>Sensibilidade <span id="sensVal">1.00</span></label>
        <input type="range" id="sens" min="0.1" max="3" step="0.05" value="1">
      </div>

      <div class="field">
        <label>Tamanho da mira <span id="sizeVal">12</span></label>
        <input type="range" id="chSize" min="4" max="24" step="1" value="12">
      </div>

      <div class="field">
        <label>Espaçamento <span id="gapVal">5</span></label>
        <input type="range" id="chGap" min="0" max="16" step="1" value="5">
      </div>

      <div class="field">
        <label>Cor da mira</label>
        <input type="color" id="chColor" value="#00e5ff">
      </div>

      <div class="field toggles">
        <label class="switch"><input type="checkbox" id="lockTgl" checked><span>Travar mouse</span></label>
        <label class="switch"><input type="checkbox" id="soundTgl" checked><span>Sons</span></label>
        <label class="switch"><input type="checkbox" id="dotTgl" checked><span>Ponto central</span></label>
      </div>
    </section>

    <button class="play" id="playBtn">INICIAR TREINO</button>
    <p class="hint">Clique para atirar · ESC pausa · O mouse fica travado durante o treino</p>
  </div>
</div>

<!-- ================= PAUSE ================= -->
<div id="pause" class="screen hidden">
  <div class="panel small">
    <h2>Pausado</h2>
    <p class="muted" style="margin-top:8px">Retome o treino quando estiver pronto.</p>
    <div class="row">
      <button class="play" id="resumeBtn">CONTINUAR</button>
      <button class="ghost" id="quitBtn">SAIR</button>
    </div>
  </div>
</div>

<!-- ================= RESULTS ================= -->
<div id="results" class="screen hidden">
  <div class="panel">
    <h2 id="resTitle">Treino concluído</h2>
    <div class="bigscore" id="resScore">0</div>
    <div class="record" id="resRecord"></div>
    <div class="grid-stats" id="resStats"></div>
    <div class="row">
      <button class="play" id="againBtn">JOGAR DE NOVO</button>
      <button class="ghost" id="menuBtn">MENU</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $  = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand  = (a, b) => a + Math.random() * (b - a);

const store = {
  get(k, d) {
    try { const v = localStorage.getItem("aimforge:" + k); return v == null ? d : JSON.parse(v); }
    catch (e) { return d; }
  },
  set(k, v) {
    try { localStorage.setItem("aimforge:" + k, JSON.stringify(v)); } catch (e) {}
  }
};

/* =========================================================
   MODOS DE JOGO
   ========================================================= */
const MODES = {
  gridshot: {
    label: "Gridshot", icon: "▦", size: 62, active: 3, kind: "click", grid: true,
    desc: "3 alvos simultâneos. Aquece mira e velocidade."
  },
  flick: {
    label: "Flick", icon: "✦", size: 72, active: 1, kind: "click",
    desc: "Um alvo por vez. Treine flicks rápidos."
  },
  micro: {
    label: "Microshot", icon: "•", size: 26, active: 1, kind: "click",
    desc: "Alvos minúsculos. Precisão cirúrgica."
  },
  reflex: {
    label: "Reflex", icon: "⚡", size: 58, active: 1, kind: "click", lifetime: 1150,
    desc: "O alvo desaparece rápido. Reaja antes."
  },
  tracking: {
    label: "Tracking", icon: "◎", size: 54, active: 1, kind: "track",
    desc: "Segure e mantenha a mira sobre o alvo móvel."
  }
};

/* =========================================================
   CONFIGURAÇÕES
   ========================================================= */
const settings = {
  duration: 60,
  sens: 1,
  lock: true,
  sound: true,
  crosshair: { color: "#00e5ff", size: 12, gap: 5, thickness: 2, dot: true }
};

(function loadSettings() {
  const s = store.get("settings", null);
  if (s) {
    Object.assign(settings, s);
    settings.crosshair = Object.assign({ color: "#00e5ff", size: 12, gap: 5, thickness: 2, dot: true }, s.crosshair || {});
  }
})();

function saveSettings() { store.set("settings", settings); }

/* =========================================================
   CANVAS / BACKGROUND
   ========================================================= */
const canvas = $("#game");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1, bg = null;

/* =========================================================
   ESTADO DO JOGO
   ========================================================= */
const G = {
  mode: "gridshot",
  phase: "menu",           // menu | playing | paused | over
  timeLeft: 0,
  score: 0,
  hits: 0,
  misses: 0,
  combo: 0,
  bestCombo: 0,
  reactions: [],
  targets: [],
  fx: [],
  crosshair: { x: 0, y: 0 },
  mouseDown: false,
  trackOn: 0,
  trackOff: 0
};

/* =========================================================
   ÁUDIO
   ========================================================= */
let actx = null;
function beep(freq, dur, type = "sine", vol = 0.05) {
  if (!settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

/* =========================================================
   RESIZE + BACKGROUND
   ========================================================= */
function buildBg() {
  bg = document.createElement("canvas");
  bg.width = Math.max(1, Math.floor(W * DPR));
  bg.height = Math.max(1, Math.floor(H * DPR));
  const c = bg.getContext("2d");
  c.setTransform(DPR, 0, 0, DPR, 0, 0);

  c.fillStyle = "#06070a";
  c.fillRect(0, 0, W, H);

  const g = c.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.8);
  g.addColorStop(0, "rgba(32,52,92,0.5)");
  g.addColorStop(0.55, "rgba(14,22,40,0.35)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  c.strokeStyle = "rgba(120,180,255,0.05)";
  c.lineWidth = 1;
  for (let x = 0; x < W; x += 46) {
    c.beginPath(); c.moveTo(x + 0.5, 0); c.lineTo(x + 0.5, H); c.stroke();
  }
  for (let y = 0; y < H; y += 46) {
    c.beginPath(); c.moveTo(0, y + 0.5); c.lineTo(W, y + 0.5); c.stroke();
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBg();
  G.crosshair.x = clamp(G.crosshair.x, 0, W);
  G.crosshair.y = clamp(G.crosshair.y, 0, H);
}

window.addEventListener("resize", resize);

/* =========================================================
   ÁREA DE JOGO
   ========================================================= */
function playArea() {
  const top = 86, bottom = 34, side = 34;
  return {
    x: side,
    y: top,
    w: Math.max(120, W - side * 2),
    h: Math.max(120, H - top - bottom)
  };
}

/* =========================================================
   SPAWN DE ALVOS
   ========================================================= */
function randomPos(r) {
  const a = playArea();
  let x = a.x + a.w / 2, y = a.y + a.h / 2;
  for (let i = 0; i < 70; i++) {
    x = a.x + r + Math.random() * Math.max(1, a.w - r * 2);
    y = a.y + r + Math.random() * Math.max(1, a.h - r * 2);
    const ok = !G.targets.some(t => Math.hypot(t.x - x, t.y - y) < t.r + r + 26);
    if (ok) break;
  }
  return { x, y };
}

function spawnTarget() {
  const cfg = MODES[G.mode];
  const r = cfg.size / 2;
  let x, y, cell = null;

  if (cfg.grid) {
    const a = playArea();
    const cols = 3, rows = 3;
    const used = new Set(G.targets.map(t => t.cell).filter(v => v != null));
    const free = [];
    for (let i = 0; i < cols * rows; i++) if (!used.has(i)) free.push(i);
    if (!free.length) return null;

    cell = free[(Math.random() * free.length) | 0];
    const cw = a.w / cols, ch = a.h / rows;
    const cx = a.x + (cell % cols) * cw + cw / 2;
    const cy = a.y + Math.floor(cell / cols) * ch + ch / 2;
    const jx = Math.max(0, cw / 2 - r - 10);
    const jy = Math.max(0, ch / 2 - r - 10);
    x = cx + rand(-jx, jx);
    y = cy + rand(-jy, jy);
  } else {
    const p = randomPos(r);
    x = p.x; y = p.y;
  }

  const now = performance.now();
  const t = { x, y, r, born: now, cell, vx: 0, vy: 0, onTarget: false };

  if (cfg.kind === "track") {
    const sp = 190 + Math.random() * 100;
    const ang = Math.random() * Math.PI * 2;
    t.vx = Math.cos(ang) * sp;
    t.vy = Math.sin(ang) * sp;
  }
  if (cfg.lifetime) t.expires = now + cfg.lifetime;

  G.targets.push(t);
  return t;
}

function removeTarget(t) {
  const i = G.targets.indexOf(t);
  if (i >= 0) G.targets.splice(i, 1);
}

/* =========================================================
   ESTATÍSTICAS
   ========================================================= */
function accuracy() {
  if (MODES[G.mode].kind === "track") {
    const tot = G.trackOn + G.trackOff;
    return tot > 0.05 ? G.trackOn / tot : null;
  }
  const tot = G.hits + G.misses;
  return tot > 0 ? G.hits / tot : null;
}

function avgReaction() {
  if (!G.reactions.length) return 0;
  return G.reactions.reduce((a, b) => a + b, 0) / G.reactions.length;
}

/* =========================================================
   AÇÕES DE JOGO
   ========================================================= */
function registerHit(t) {
  const now = performance.now();
  const rt = now - t.born;

  G.hits++;
  G.combo++;
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  G.reactions.push(rt);

  const speedBonus = Math.round(Math.max(0, 1 - rt / 1000) * 150);
  const comboBonus = Math.round(Math.min(G.combo, 20) * 5);
  const pts = 100 + speedBonus + comboBonus;
  G.score += pts;

  addFx(t.x, t.y, "hit", "+" + pts);
  removeTarget(t);
  spawnTarget();

  beep(720 + Math.min(G.combo, 12) * 34, 0.07, "triangle", 0.05);
}

function registerMiss() {
  G.misses++;
  G.combo = 0;
  addFx(G.crosshair.x, G.crosshair.y, "miss");
  beep(150, 0.08, "sawtooth", 0.03);
}

function addFx(x, y, type, text) {
  G.fx.push({ x, y, type, text: text || "", t: performance.now() });
}

function handleClick() {
  if (G.phase !== "playing") return;
  if (MODES[G.mode].kind === "track") return;

  const x = G.crosshair.x, y = G.crosshair.y;
  let hit = null;
  for (let i = G.targets.length - 1; i >= 0; i--) {
    const t = G.targets[i];
    if (Math.hypot(t.x - x, t.y - y) <= t.r) { hit = t; break; }
  }
  if (hit) registerHit(hit);
  else registerMiss();
}

/* =========================================================
   CICLO DE JOGO
   ========================================================= */
function startGame() {
  const cfg = MODES[G.mode];

  G.phase = "playing";
  G.timeLeft = settings.duration;
  G.score = 0;
  G.hits = 0;
  G.misses = 0;
  G.combo = 0;
  G.bestCombo = 0;
  G.reactions = [];
  G.targets = [];
  G.fx = [];
  G.trackOn = 0;
  G.trackOff = 0;
  G.mouseDown = false;
  G.crosshair.x = W / 2;
  G.crosshair.y = H / 2;

  for (let i = 0; i < cfg.active; i++) spawnTarget();

  $("#hudComboLabel").textContent = cfg.kind === "track" ? "No alvo" : "Combo";
  showScreen(null);
  $("#hud").classList.remove("hidden");

  if (settings.lock && canvas.requestPointerLock) {
    try { canvas.requestPointerLock(); } catch (e) {}
  }
}

function pauseGame() {
  if (G.phase !== "playing") return;
  G.phase = "paused";
  G.mouseDown = false;
  showScreen("#pause");
}

function resumeGame() {
  if (G.phase !== "paused") return;
  G.phase = "playing";
  showScreen(null);
  if (settings.lock && canvas.requestPointerLock) {
    try { canvas.requestPointerLock(); } catch (e) {}
  }
}

function endGame() {
  G.phase = "over";
  G.mouseDown = false;
  if (document.pointerLockElement) document.exitPointerLock();

  const key = "best:" + G.mode;
  const prevBest = store.get(key, 0);
  const isRecord = G.score > prevBest && G.score > 0;
  if (isRecord) store.set(key, Math.round(G.score));

  $("#hud").classList.add("hidden");
  renderResults(isRecord);
  showScreen("#results");
  refreshModes();

  if (isRecord) beep(1040, 0.35, "triangle", 0.06);
}

function quitToMenu() {
  G.phase = "menu";
  G.targets = [];
  G.fx = [];
  G.mouseDown = false;
  if (document.pointerLockElement) document.exitPointerLock();
  $("#hud").classList.add("hidden");
  showScreen("#menu");
  refreshModes();
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
  const now = performance.now();
  const cfg = MODES[G.mode];

  G.timeLeft -= dt;
  if (G.timeLeft <= 0) {
    G.timeLeft = 0;
    endGame();
    return;
  }

  // Alvos com tempo de vida (Reflex)
  if (cfg.lifetime) {
    for (const t of G.targets.slice()) {
      if (now - t.born > cfg.lifetime) {
        removeTarget(t);
        registerMiss();
      }
    }
  }

  // Tracking
  if (cfg.kind === "track") {
    const a = playArea();
    for (const t of G.targets) {
      t.x += t.vx * dt;
      t.y += t.vy * dt;

      if (t.x < a.x + t.r) { t.x = a.x + t.r; t.vx = Math.abs(t.vx); }
      if (t.x > a.x + a.w - t.r) { t.x = a.x + a.w - t.r; t.vx = -Math.abs(t.vx); }
      if (t.y < a.y + t.r) { t.y = a.y + t.r; t.vy = Math.abs(t.vy); }
      if (t.y > a.y + a.h - t.r) { t.y = a.y + a.h - t.r; t.vy = -Math.abs(t.vy); }

      // pequena variação orgânica
      t.vx += rand(-140, 140) * dt;
      t.vy += rand(-140, 140) * dt;

      const sp = Math.hypot(t.vx, t.vy);
      const maxSp = 360;
      if (sp > maxSp) { t.vx *= maxSp / sp; t.vy *= maxSp / sp; }
      if (sp < 120) { t.vx *= 1.02; t.vy *= 1.02; }

      t.onTarget = G.mouseDown &&
        Math.hypot(G.crosshair.x - t.x, G.crosshair.y - t.y) <= t.r;
    }

    const t = G.targets[0];
    if (t && G.mouseDown) {
      if (t.onTarget) {
        G.trackOn += dt;
        G.score += 60 * dt;
      } else {
        G.trackOff += dt;
      }
    }
  }

  // Limpa efeitos
  G.fx = G.fx.filter(f => now - f.t < 620);
}

/* =========================================================
   RENDER
   ========================================================= */
function drawPlayArea() {
  const a = playArea();
  ctx.save();
  ctx.strokeStyle = "rgba(120,180,255,0.10)";
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 10]);
  ctx.strokeRect(a.x + 0.5, a.y + 0.5, a.w - 1, a.h - 1);
  ctx.restore();
}

function drawTarget(t, now) {
  const cfg = MODES[G.mode];
  const age = now - t.born;
  const p = clamp(age / 140, 0, 1);
  const ease = 1 - Math.pow(1 - p, 3);

  let r = t.r * (0.55 + 0.45 * ease);

  if (cfg.lifetime) {
    const frac = 1 - age / cfg.lifetime;
    r *= clamp(frac, 0.4, 1);
  }

  const tracking = cfg.kind === "track" && t.onTarget;

  ctx.save();
  ctx.globalAlpha = clamp(ease * 1.3, 0, 1);

  // brilho externo
  const glowR = r * 2.4;
  const gg = ctx.createRadialGradient(t.x, t.y, r * 0.3, t.x, t.y, glowR);
  if (tracking) {
    gg.addColorStop(0, "rgba(90,255,190,0.55)");
    gg.addColorStop(1, "rgba(90,255,190,0)");
  } else {
    gg.addColorStop(0, "rgba(90,210,255,0.35)");
    gg.addColorStop(1, "rgba(90,210,255,0)");
  }
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(t.x, t.y, glowR, 0, Math.PI * 2);
  ctx.fill();

  // corpo
  const body = ctx.createRadialGradient(
    t.x - r * 0.35, t.y - r * 0.4, r * 0.08,
    t.x, t.y, r
  );
  if (tracking) {
    body.addColorStop(0, "#e6fff4");
    body.addColorStop(0.55, "#5cf7b8");
    body.addColorStop(1, "#0aa86b");
  } else {
    body.addColorStop(0, "#dcfbff");
    body.addColorStop(0.55, "#41d2ff");
    body.addColorStop(1, "#0b6ed6");
  }
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
  ctx.fill();

  // anel
  ctx.lineWidth = 2;
  ctx.strokeStyle = tracking ? "rgba(230,255,245,0.95)" : "rgba(220,250,255,0.85)";
  ctx.stroke();

  // ponto interno
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.arc(t.x, t.y, Math.max(1.2, r * 0.15), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFx(now) {
  for (const f of G.fx) {
    const age = (now - f.t) / 550;
    if (age > 1) continue;
    const a = 1 - age;

    if (f.type === "hit") {
      ctx.save();
      ctx.globalAlpha = a * 0.85;
      ctx.strokeStyle = "#9df6ff";
      ctx.lineWidth = 3 * (1 - age) + 0.8;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 18 + age * 72, 0, Math.PI * 2);
      ctx.stroke();

      ctx.globalAlpha = a;
      ctx.fillStyle = "#d6fdff";
      ctx.font = "700 17px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y - 32 - age * 46);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = a * 0.85;
      ctx.strokeStyle = "#ff4d6d";
      ctx.lineWidth = 2;
      const s = 13;
      ctx.beginPath();
      ctx.moveTo(f.x - s, f.y - s); ctx.lineTo(f.x + s, f.y + s);
      ctx.moveTo(f.x + s, f.y - s); ctx.lineTo(f.x - s, f.y + s);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function drawCrosshair() {
  const c = settings.crosshair;
  const { x, y } = G.crosshair;
  const L = c.size, g = c.gap;

  ctx.save();
  ctx.strokeStyle = c.color;
  ctx.fillStyle = c.color;
  ctx.lineWidth = c.thickness;
  ctx.lineCap = "round";
  ctx.shadowColor = c.color;
  ctx.shadowBlur = 10;

  ctx.beginPath();
  ctx.moveTo(x, y - g - L); ctx.lineTo(x, y - g);
  ctx.moveTo(x, y + g);     ctx.lineTo(x, y + g + L);
  ctx.moveTo(x - g - L, y); ctx.lineTo(x - g, y);
  ctx.moveTo(x + g, y);     ctx.lineTo(x + g + L, y);
  ctx.stroke();

  if (c.dot) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(1, c.thickness * 0.85), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function render(now) {
  ctx.drawImage(bg, 0, 0, W, H);

  if (G.phase === "playing" || G.phase === "paused") {
    drawPlayArea();
  }

  for (const t of G.targets) drawTarget(t, now);
  drawFx(now);

  if (G.phase === "playing" || G.phase === "paused") {
    drawCrosshair();
  }
}

/* =========================================================
   HUD
   ========================================================= */
function updateHud() {
  const cfg = MODES[G.mode];
  $("#hudTime").textContent = G.timeLeft.toFixed(1);
  $("#hudScore").textContent = Math.round(G.score).toLocaleString("pt-BR");

  const acc = accuracy();
  $("#hudAcc").textContent = acc == null ? "—" : Math.round(acc * 100) + "%";

  if (cfg.kind === "track") {
    const tot = G.trackOn + G.trackOff;
    $("#hudCombo").textContent = tot > 0.05 ? Math.round((G.trackOn / tot) * 100) + "%" : "0%";
  } else {
    $("#hudCombo").textContent = "x" + G.combo;
  }

  const pct = clamp(G.timeLeft / settings.duration, 0, 1) * 100;
  const fill = $("#timerfill");
  fill.style.width = pct + "%";
  fill.classList.toggle("low", pct < 25);
}

/* =========================================================
   LOOP PRINCIPAL
   ========================================================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (G.phase === "playing") {
    update(dt);
    if (G.phase === "playing") updateHud();
  }

  render(now);
  requestAnimationFrame(loop);
}

/* =========================================================
   INPUT
   ========================================================= */
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement === canvas) {
    G.crosshair.x = clamp(G.crosshair.x + e.movementX * settings.sens, 0, W);
    G.crosshair.y = clamp(G.crosshair.y + e.movementY * settings.sens, 0, H);
  } else if (G.phase === "playing" && !settings.lock) {
    const r = canvas.getBoundingClientRect();
    G.crosshair.x = clamp(e.clientX - r.left, 0, W);
    G.crosshair.y = clamp(e.clientY - r.top, 0, H);
  }
});

canvas.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  if (G.phase !== "playing") return;
  if (settings.lock && document.pointerLockElement !== canvas) {
    canvas.requestPointerLock();
    return;
  }
  G.mouseDown = true;
  handleClick();
});

window.addEventListener("mouseup", () => { G.mouseDown = false; });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

document.addEventListener("pointerlockchange", () => {
  const locked = document.pointerLockElement === canvas;
  if (!locked && G.phase === "playing" && settings.lock) {
    pauseGame();
  }
});

document.addEventListener("pointerlockerror", () => {
  settings.lock = false;
  saveSettings();
  syncInputs();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && G.phase === "playing" && !settings.lock) {
    pauseGame();
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && G.phase === "playing") pauseGame();
});

/* =========================================================
   UI — TELAS
   ========================================================= */
function showScreen(sel) {
  ["#menu", "#pause", "#results"].forEach(s => $(s).classList.add("hidden"));
  if (sel) $(sel).classList.remove("hidden");
}

/* ---------- Cards de modo ---------- */
const modeList = $("#modeList");
Object.entries(MODES).forEach(([key, m]) => {
  const el = document.createElement("button");
  el.className = "mode-card";
  el.dataset.mode = key;

  const mi = document.createElement("span"); mi.className = "mi"; mi.textContent = m.icon;
  const mt = document.createElement("span"); mt.className = "mt"; mt.textContent = m.label;
  const md = document.createElement("span"); md.className = "md"; md.textContent = m.desc;
  const mb = document.createElement("span"); mb.className = "mb";

  el.append(mi, mt, md, mb);
  el.addEventListener("click", () => {
    G.mode = key;
    refreshModes();
    beep(520, 0.05, "sine", 0.03);
  });
  modeList.appendChild(el);
});

function refreshModes() {
  [...modeList.children].forEach(el => {
    const key = el.dataset.mode;
    el.classList.toggle("on", key === G.mode);
    const best = store.get("best:" + key, 0);
    el.querySelector(".mb").textContent = best > 0
      ? "REC " + Math.round(best).toLocaleString("pt-BR")
      : "";
  });
}

/* ---------- Resultados ---------- */
function renderResults(isRecord) {
  const cfg = MODES[G.mode];
  const acc = accuracy();
  const best = store.get("best:" + G.mode, 0);

  $("#resTitle").textContent = cfg.label + " — concluído";
  $("#resScore").textContent = Math.round(G.score).toLocaleString("pt-BR");
  $("#resRecord").textContent = isRecord ? "★ NOVO RECORDE PESSOAL" : "";

  const stats = [];
  stats.push(["Precisão", acc == null ? "—" : (acc * 100).toFixed(1) + "%"]);

  if (cfg.kind === "track") {
    stats.push(["Tempo no alvo", G.trackOn.toFixed(1) + "s"]);
    stats.push(["Fora do alvo", G.trackOff.toFixed(1) + "s"]);
  } else {
    stats.push(["Acertos", String(G.hits)]);
    stats.push(["Erros", String(G.misses)]);
    stats.push(["Reação média", G.reactions.length ? Math.round(avgReaction()) + " ms" : "—"]);
    stats.push(["Melhor combo", "x" + G.bestCombo]);
  }
  stats.push(["Recorde", Math.round(best).toLocaleString("pt-BR")]);

  const wrap = $("#resStats");
  wrap.innerHTML = "";
  stats.forEach(([k, v]) => {
    const d = document.createElement("div");
    d.className = "gstat";
    const kk = document.createElement("div"); kk.className = "k"; kk.textContent = k;
    const vv = document.createElement("div"); vv.className = "v"; vv.textContent = v;
    d.append(kk, vv);
    wrap.appendChild(d);
  });
}

/* =========================================================
   UI — CONFIGURAÇÕES
   ========================================================= */
function syncInputs() {
  $("#sens").value = settings.sens;
  $("#sensVal").textContent = Number(settings.sens).toFixed(2);

  $("#chSize").value = settings.crosshair.size;
  $("#sizeVal").textContent = settings.crosshair.size;

  $("#chGap").value = settings.crosshair.gap;
  $("#gapVal").textContent = settings.crosshair.gap;

  $("#chColor").value = settings.crosshair.color;
  $("#lockTgl").checked = settings.lock;
  $("#soundTgl").checked = settings.sound;
  $("#dotTgl").checked = settings.crosshair.dot;

  [...$("#durChips").children].forEach(b => {
    b.classList.toggle("on", Number(b.dataset.dur) === Number(settings.duration));
  });
}

$("#durChips").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-dur]");
  if (!b) return;
  settings.duration = Number(b.dataset.dur);
  saveSettings();
  syncInputs();
});

$("#sens").addEventListener("input", (e) => {
  settings.sens = Number(e.target.value);
  $("#sensVal").textContent = settings.sens.toFixed(2);
  saveSettings();
});

$("#chSize").addEventListener("input", (e) => {
  settings.crosshair.size = Number(e.target.value);
  $("#sizeVal").textContent = e.target.value;
  saveSettings();
});

$("#chGap").addEventListener("input", (e) => {
  settings.crosshair.gap = Number(e.target.value);
  $("#gapVal").textContent = e.target.value;
  saveSettings();
});

$("#chColor").addEventListener("input", (e) => {
  settings.crosshair.color = e.target.value;
  saveSettings();
});

$("#lockTgl").addEventListener("change", (e) => {
  settings.lock = e.target.checked;
  saveSettings();
});

$("#soundTgl").addEventListener("change", (e) => {
  settings.sound = e.target.checked;
  saveSettings();
  if (settings.sound) beep(660, 0.07, "sine", 0.04);
});

$("#dotTgl").addEventListener("change", (e) => {
  settings.crosshair.dot = e.target.checked;
  saveSettings();
});

/* =========================================================
   UI — BOTÕES
   ========================================================= */
$("#playBtn").addEventListener("click", () => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  startGame();
});

$("#resumeBtn").addEventListener("click", resumeGame);
$("#quitBtn").addEventListener("click", quitToMenu);
$("#againBtn").addEventListener("click", startGame);
$("#menuBtn").addEventListener("click", quitToMenu);

/* =========================================================
   BOOT
   ========================================================= */
resize();
syncInputs();
refreshModes();
showScreen("#menu");
requestAnimationFrame(loop);
</script>
</body>
</html>
